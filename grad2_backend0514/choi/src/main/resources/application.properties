spring.datasource.url=jdbc:postgresql://bankdb.c12yak4o0wk1.ap-northeast-2.rds.amazonaws.com:5432/central
spring.datasource.username=postgres
spring.datasource.password=kdu21240

# PostgreSQL 방언 설정 (Hibernate가 PostgreSQL 전용 쿼리를 생성하도록 함)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 자동 커밋/플러시 설정 (기존 autocommit=False와 유사한 관리)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.com.example.choi.recommendation=debug

